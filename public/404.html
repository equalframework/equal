  <style>
    :root {
      --ink: #10233a;
      --muted: #526579;
      --line: #dbe4ee;
      --primary: #3775ef;
      --primary-hover: #2f68d7;
      --surface: #ffffff;
      --focus: rgba(55,117,239,.24);
    }

    * { box-sizing: border-box; }

    html { color-scheme: light; }

    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--surface);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .page {
      position: relative;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .shell {
      width: min(100% - 48px, 1320px);
      margin-inline: auto;
    }

    header {
      position: absolute;
      inset: 0 0 auto 0;
      z-index: 2;
      padding-top: clamp(20px, 4vw, 44px);
      pointer-events: none;
    }

    header .brand {
      pointer-events: auto;
    }

    .brand {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      color: var(--ink);
      text-decoration: none;
      width: clamp(190px, 18vw, 272px);
    }

    .brand img {
      width: clamp(190px, 18vw, 272px);
      height: auto;
      display: block;
    }

    .brand-tagline {
        margin-top: 8px;
        color: var(--muted);
        font-size: 15px;
        font-weight: 600;
        white-space: nowrap;
        text-align: center;
        display: inline-block;
        width: 100%;
    }

    main {
      flex: 1 0 auto;
      display: grid;
      place-items: start center;
      padding: clamp(45px, 4.5vw, 62px) 0 clamp(24px, 3vw, 36px);
    }

    .error {
      width: min(100%, 1020px);
      text-align: center;
    }

    .illustration-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: clamp(8px, 1.3vw, 18px);
    }

    .illustration {
      width: min(100%, 936px);
      height: auto;
      display: block;
      filter: drop-shadow(0 12px 22px rgba(15, 35, 58, .05));
    }

    h1 {
      margin: 0;
      color: #0d337f;
      font-size: clamp(2.6rem, 5.6vw, 5.15rem);
      line-height: .98;
      letter-spacing: -.045em;
      font-weight: 800;
    }

    .lead {
      margin: clamp(14px, 2.4vw, 24px) auto 0;
      max-width: 780px;
      color: var(--muted);
      font-size: clamp(1rem, 1.8vw, 1.4rem);
      line-height: 1.42;
      font-weight: 500;
    }

    .actions {
      margin-top: clamp(20px, 3vw, 32px);
      display: flex;
      justify-content: center;
    }

    .primary {
      min-height: 62px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 0 34px;
      border: 1px solid transparent;
      border-radius: 15px;
      background: var(--primary);
      color: white;
      text-decoration: none;
      font-size: clamp(1.05rem, 1.5vw, 1.28rem);
      font-weight: 700;
      box-shadow: 0 8px 22px rgba(55, 117, 239, .18);
      transition: background-color .16s ease, transform .16s ease, box-shadow .16s ease;
    }

    .primary:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(55, 117, 239, .24);
    }

    .primary:focus-visible,
    .secondary-links a:focus-visible,
    .secondary-links button:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 4px;
    }

    .primary svg {
      width: 26px;
      height: 26px;
      flex: 0 0 auto;
    }


    a {
      color: #0f4490;
    }
    
    .secondary-links {
      margin-top: 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 9px 14px;
      color: #0f4490;
      font-weight: 700;
      font-size: clamp(.94rem, 1.3vw, 1.08rem);
    }

    .secondary-links a,
    .secondary-links button {
      appearance: none;
      border: 0;
      background: none;
      padding: 3px 0;
      color: inherit;
      font: inherit;
      text-decoration: none;
      cursor: pointer;
    }

    .secondary-links a:hover,
    .secondary-links button:hover {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .divider {
      opacity: .55;
      user-select: none;
    }

    footer {
      padding-bottom: clamp(20px, 3vw, 34px);
    }

    .footer-inner {
      border-top: 1px solid var(--line);
      padding-top: 18px;
      text-align: center;
      color: #2458aa;
      font-size: clamp(.86rem, 1.2vw, 1rem);
      font-weight: 600;
    }

    @media (max-width: 700px) {
      .shell { width: min(100% - 28px, 1320px); }

      header {
        position: static;
        padding-top: 18px;
      }

      .brand img { width: 188px; }

      main {
        padding-top: 22px;
      }

      .illustration-wrap {
        margin-inline: -6px;
      }

      h1 {
        font-size: clamp(2.4rem, 12vw, 3.6rem);
      }

      .lead {
        max-width: 34rem;
      }

      .primary {
        width: min(100%, 360px);
        min-height: 58px;
        border-radius: 14px;
      }
    }

    @media (max-width: 430px) {
      .secondary-links {
        gap: 8px 10px;
        font-size: .94rem;
      }

      .divider { display: none; }
      .secondary-links > * { margin-inline: 6px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
